[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
remappings = [
  "openzeppelin-solidity/=lib/openzeppelin-solidity/",
  "forge-std/=lib/forge-std/src/",
]
# per-file solc auto-detection: vendored V1 + V2 compile with 0.6.12, tests with 0.8.x
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
# fork tests need no private key or API key; keyless public BSC endpoints only
[rpc_endpoints]
# Fork tests pin Facts.FORK_BLOCK; the bnbchain dataseed nodes are NOT archive (state window
# measured at ~128 blocks on 2026-10-26), so a keyless archive endpoint is the default.
# Probed keyless on 2026-10-26: blastapi serves block 129782171 and 80681471; tatum serves 129782171 (zan.top also does but is in a lane READ_RPCS list, so not used).
bsc = "https://bsc-mainnet.public.blastapi.io"
bsc_tatum = "https://bsc-mainnet.gateway.tatum.io"
bsc_dataseed = "https://bsc-dataseed.bnbchain.org"            # latest ~128 blocks only
bsc_dataseed1 = "https://bsc-dataseed1.defibit.io"
bsc_dataseed2 = "https://bsc-dataseed1.ninicoin.io"
